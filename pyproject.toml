[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "apple-tv-agent"
version = "0.1.0a1"
description = "Local Apple TV discovery, pairing and controls for agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.3",
  "pyatv==0.18.0",
  "keyring==25.7.0",
  "platformdirs==4.11.7",
  "pydantic==2.13.5",
  "filelock==3.32.5",
]

[project.optional-dependencies]
screen = ["Pillow==12.3.0"]

[project.scripts]
apple-tv-agent = "apple_tv_agent.cli:main"
apple-tv-screen = "apple_tv_agent.observation.cli:main"

[dependency-groups]
dev = [
  "build==1.6.0",
  "hatchling==1.32.0",
  "jsonschema>=4.26.0",
  "pytest==9.1.1",
  "ruff==0.16.6",
  "uv==0.12.10",
  "PyYAML==6.0.3",
]
release = [
    "pyinstaller==6.22.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_tv_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "skills", "pyproject.toml", "README.md", "docs/cli-contract.md", "docs/registry.md", "docs/pairing.md", "docs/sessions.md", "docs/controls.md", "docs/troubleshooting.md", "docs/apps-keyboard.md", "docs/lg-discovery.md", "docs/lg-pairing.md", "docs/lg-capture.md", "docs/downloads.md", "docs/release-pipeline.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/observation-v1.json" = "apple_tv_agent/observation-v1.json"
"schemas/response-v1.json" = "apple_tv_agent/response-v1.json"
"docs/registry.md" = "apple_tv_agent/docs/registry.md"
"docs/pairing.md" = "apple_tv_agent/docs/pairing.md"
"docs/sessions.md" = "apple_tv_agent/docs/sessions.md"
"docs/controls.md" = "apple_tv_agent/docs/controls.md"
"docs/troubleshooting.md" = "apple_tv_agent/docs/troubleshooting.md"
"docs/apps-keyboard.md" = "apple_tv_agent/docs/apps-keyboard.md"
"skills/apple-tv-control" = "apple_tv_agent/skills/apple-tv-control"

"docs/lg-discovery.md" = "apple_tv_agent/docs/lg-discovery.md"

"docs/lg-pairing.md" = "apple_tv_agent/docs/lg-pairing.md"

"docs/lg-capture.md" = "apple_tv_agent/docs/lg-capture.md"

"docs/downloads.md" = "apple_tv_agent/docs/downloads.md"
"docs/release-pipeline.md" = "apple_tv_agent/docs/release-pipeline.md"

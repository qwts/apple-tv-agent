name: Package and transport

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install lock tooling
        run: python -m pip install uv==0.12.10
      - name: Install locked development environment
        run: uv sync --locked --extra screen --python ${{ matrix.python }}
      - name: Check dependencies and native backend selection
        run: |
          uv pip check
          uv run --locked --no-sync python tools/transport_probe.py environment
      - name: Lint and formatting
        run: |
          uv run --locked --no-sync ruff check src tests/contract tests/unit tests/integration tools/verify_pairing.py tools/generate_schema.py tools/check_wheel.py tools/check_skill.py tests/skill
          uv run --locked --no-sync ruff format --check src tests/contract tests/unit tests/integration tools/verify_pairing.py tools/generate_schema.py tools/check_wheel.py tools/check_skill.py tests/skill
      - name: Contract and probe tests without hardware
        run: uv run --locked --no-sync python -m pytest -q
      - name: Build source distribution and wheel with locked build dependencies
        run: uv run --locked --no-sync python -m build --no-isolation
      - name: Export hashed runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file runtime-requirements.txt
          uv export --locked --extra screen --no-dev --no-emit-project --output-file screen-requirements.txt
      - name: Verify clean wheel installation and both entry points
        run: uv run --locked --no-sync python tools/check_wheel.py --requirements runtime-requirements.txt --screen-requirements screen-requirements.txt
